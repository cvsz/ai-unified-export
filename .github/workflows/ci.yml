name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pipx install ruff
      - name: Run ruff
        run: ruff check scripts/ tests/

  compile:
    name: Compile (py_compile + compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all scripts
        run: |
          python -m py_compile scripts/ai_unified_export.py scripts/ai_export_monitor.py scripts/ai_model_manager.py scripts/ai_tools_installer.py scripts/discover_ai_server.py scripts/export_ai_cli.py
          python -m compileall -q scripts/ tests/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run integration tests
        run: python -m unittest tests.test_integration -v

  smoke:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run make validate
        run: make validate

  shellcheck:
    name: Shellcheck (Makefile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on Makefile
        run: shellcheck Makefile

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit safety
      - name: Run bandit
        run: bandit -r scripts/ -f json -o bandit-report.json || true
      - name: Run safety
        run: safety check --json --output safety-report.json || true

  package:
    name: Build & Verify Package
    runs-on: ubuntu-latest
    needs: [lint, compile, test, smoke, shellcheck]
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: make package
      - name: Verify package integrity
        run: unzip -t ../ai-unified-server-cli-exporter-wsl2-full.zip

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs exist
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/OUTPUT-SCHEMA.md
          test -f docs/RUNBOOK.md
          test -f docs/TROUBLESHOOTING.md
          test -f docs/LEGACY-SCRIPTS.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f AUDIT-PLAN.md
          test -f Final-Report.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true