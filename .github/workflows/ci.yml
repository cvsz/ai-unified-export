name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check scripts/ tests/

  compile:
    name: Compile (py_compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile all scripts and tests
        run: |
          python3 -m py_compile scripts/ai_unified_export.py scripts/ai_export_monitor.py scripts/ai_model_manager.py scripts/ai_tools_installer.py scripts/discover_ai_server.py scripts/export_ai_cli.py
          python3 -m compileall -q scripts/ tests/

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    needs: [lint, compile]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run unittest suite
        run: python3 -m unittest discover -s tests -v

  smoke:
    name: CLI smoke checks (make validate)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run make validate (compile + tests + smoke)
        run: make validate

  shellcheck:
    name: Shellcheck Makefile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck Makefile recipes
        run: shellcheck -s make Makefile || true
